[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usml-homework"
version = "0.1.0"
description = "Unsupervised ML homework: arXiv topic clustering and content-based recommendation."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "arxiv>=2.1.3",
  "bertopic>=0.16.4",
  "hdbscan>=0.8.38.post1",
  "ipykernel>=6.29.5",
  "jupyterlab>=4.2.5",
  "kneed>=0.8.5",
  "matplotlib>=3.9.2",
  "nbformat>=5.10.4",
  "numpy>=1.26.4,<3",
  "openai>=1.50.0",
  "pandas>=2.2.3",
  "plotly>=5.24.1",
  "pyarrow>=17.0.0",
  "scikit-learn>=1.5.2",
  "scipy>=1.14.1",
  "sentence-transformers>=3.1.1",
  "tqdm>=4.66.5",
  "umap-learn>=0.5.6",
]

[tool.setuptools]
py-modules = []
